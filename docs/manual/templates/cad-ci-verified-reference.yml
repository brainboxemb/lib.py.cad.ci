# Root CAD-CI profile for independent build123d/CadQuery references.
# The verification pin is immutable and intentionally independent from the
# reference runtime image version.

schema: 1

defaults:
  timeout_seconds: 300

verification:
  package:
    repository: brainboxemb/lib.py.cad.verification
    version: "0.16.0"
    commit: c7c145b7be0c602724e8cca874ef29990baaad1e

runtimes:
  reference: ghcr.io/owner/cad-reference:v1.2.3

templates:
  verified-reference:
    kind: verification
    builder: build123d
    verification:
      adapter: mesh-geometry
      definition: ../verification/reference_geometry.json
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json

items:
  - models/*/*
