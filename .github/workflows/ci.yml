name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: brainboxemb/tool.py.lib.ci/.github/workflows/reusable-ci.yml@d189d0718659ca3927f1dddbe373c1c788b11b6c
    with:
      python_version: "3.12"

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.change_scope != 'docs-only'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish declared release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
