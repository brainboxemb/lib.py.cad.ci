[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-ci-lib"
version = "0.11.0"
description = "Reusable Python library for BrainboxEmb CAD CI"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "SCons==4.11.1"]

[tool.setuptools]
packages = ["cad_ci"]
